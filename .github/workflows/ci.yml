name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libpulse-dev libasound2-dev libudev-dev

      - name: Test
        run: cargo test --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

  # libspa 0.10.1 expects newer SPA headers than Ubuntu 22.04 ships (it uses
  # spa_meta_region_is_valid, spa_meta_first and spa_video_info_raw.flags),
  # so 22.04 cannot build it. Build on 24.04 (glibc 2.39); the artifact runs
  # on Ubuntu 24.04+ / Fedora 40+ / current Arch.
  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libpulse-dev libasound2-dev libudev-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test
        run: ./target/release/dygmarave --version

      - name: Package
        run: |
          tar -czf dygmarave-x86_64-linux.tar.gz -C target/release dygmarave
          sha256sum dygmarave-x86_64-linux.tar.gz > dygmarave-x86_64-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: dygmarave-x86_64-linux
          path: |
            dygmarave-x86_64-linux.tar.gz
            dygmarave-x86_64-linux.tar.gz.sha256
          if-no-files-found: error
