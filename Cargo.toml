[package]
name = "dygmarave"
version = "0.1.0"
edition = "2021"
description = "Audio-reactive per-key LED visualizer for the Dygma Raise"
license = "MIT OR Apache-2.0"

[dependencies]
dygma_focus = "0.5.1"
serialport = "4"
cpal = { version = "0.18", default-features = false, features = ["pipewire", "pulseaudio"] }
realfft = "3.5"
ctrlc = "3"

[profile.release]
strip = true
